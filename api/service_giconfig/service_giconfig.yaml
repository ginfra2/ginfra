                    enum:
                        - put
                        - remove
                    type: string
                - description: Unique deployment name.
                  in: path
                  name: deployment
                  required: true
                  schema:
                    type: string
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/ConfigPortalRequest'
                description: Register a portal.
                required: true
            responses:
                "200":
                    description: Success
                "400":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorResponse'
                    description: Bad request
                "403":
                    description: Not authorized
                "500":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorResponse'
                    description: InternalError
            summary: Register or update a portal.
    /configservice/putvalue:
        post:
            description: Put a value for the domain.
            operationId: giConfigPutValue
            parameters:
