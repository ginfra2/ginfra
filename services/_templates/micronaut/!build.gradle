plugins {
    id("com.github.johnrengelman.shadow") version "8.1.1"
    id("io.micronaut.application") version "4.4.0"
    id("io.micronaut.aot") version "4.4.0"
    id("io.micronaut.openapi") version '4.4.2'
}

version = "0.1"  // If you change version, you must change the jar name in start_local.sh and start_local.cmd.
group = "tech.ginfra.<<<ServiceName>>>"

repositories {
    mavenCentral()
    mavenLocal()
}

dependencies {
    annotationProcessor("io.micronaut.data:micronaut-data-processor")
    annotationProcessor("io.micronaut:micronaut-http-validation")
    annotationProcessor("io.micronaut.openapi:micronaut-openapi")
    annotationProcessor("io.micronaut.security:micronaut-security-annotations")
    annotationProcessor("io.micronaut.serde:micronaut-serde-processor")
    annotationProcessor("io.micronaut.validation:micronaut-validation-processor")
    implementation('io.swagger:swagger-annotations:1.6.8')
    implementation("com.google.code.findbugs:jsr305:3.0.2")
    implementation('com.squareup.okhttp3:okhttp:4.10.0')
    implementation('com.squareup.okhttp3:logging-interceptor:4.10.0')
    implementation('com.google.code.gson:gson:2.9.1')
    implementation('io.gsonfire:gson-fire:1.9.0')
    implementation('javax.ws.rs:jsr311-api:1.1.1')
    implementation('javax.ws.rs:javax.ws.rs-api:2.1.1')
    implementation('org.openapitools:jackson-databind-nullable:0.2.6')
    implementation(group: 'org.apache.commons', name: 'commons-lang3', version: '3.12.0')
    implementation("jakarta.annotation:jakarta.annotation-api:1.3.5")
    implementation("io.micrometer:context-propagation")
    implementation("io.micronaut.data:micronaut-data-jdbc")
    implementation("io.micronaut.flyway:micronaut-flyway")
    implementation("io.micronaut.reactor:micronaut-reactor")
    implementation("io.micronaut.security:micronaut-security")
    implementation("io.micronaut.serde:micronaut-serde-jackson")
    implementation("io.micronaut.sql:micronaut-jdbc-hikari")
    implementation("io.micronaut.validation:micronaut-validation")
    implementation("jakarta.validation:jakarta.validation-api")
    implementation("net.logstash.logback:logstash-logback-encoder:8.0")
    implementation("ch.qos.logback:logback-classic:1.5.3")
    implementation("ch.qos.logback:logback-core:1.5.3")
    implementation("org.slf4j:slf4j-api:2.0.13")
    implementation("tech.ginfra:service_giconfig:0.0.2")
    implementation("javax.annotation:javax.annotation-api:1.3.2")
    implementation("tech.ginfra:ginfra:1.0.0")
    implementation("io.opentelemetry:opentelemetry-sdk:1.40.0");
    implementation("io.opentelemetry:opentelemetry-sdk-extension-autoconfigure:1.40.0");
    implementation("io.opentelemetry:opentelemetry-exporter-otlp");
    compileOnly("io.micronaut:micronaut-http-client")
    compileOnly("io.micronaut.openapi:micronaut-openapi-annotations")
    runtimeOnly("org.flywaydb:flyway-database-postgresql")
    runtimeOnly("org.postgresql:postgresql")
    testImplementation("io.micronaut:micronaut-http-client")
    testImplementation 'org.junit.jupiter:junit-jupiter-api:5.8.1'
    testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine:5.8.1'
}


application {
    mainClass = "tech.ginfra.service.Application"
}
java {
    sourceCompatibility = JavaVersion.toVersion("17")
    targetCompatibility = JavaVersion.toVersion("17")
}


graalvmNative.toolchainDetection = false
micronaut {
    runtime("netty")
    testRuntime("junit5")
    processing {
        incremental(true)
        annotations("tech.ginfra.service_gipet.*")
    }
    aot {
    // Please review carefully the optimizations enabled below
    // Check https://micronaut-projects.github.io/micronaut-aot/latest/guide/ for more details
        optimizeServiceLoading = false
        convertYamlToJava = false
        precomputeOperations = true
        cacheEnvironment = true
        optimizeClassLoading = true
        deduceEnvironment = true
        optimizeNetty = true
        replaceLogbackXml = false       // Breaks the build with an NPE
    }

    openapi {
        client(file("src/main/resources/merged.yaml")) {
            apiPackageName = "client.micronaut.api"
            modelPackageName = "client.micronaut.model"
            useReactive = false
        }
        server(file("src/main/resources/merged.yaml")) {
            apiPackageName = "micronaut.api"
            modelPackageName = "micronaut.model"
            useReactive = false
            useAuth = true
        }
    }
}



